<text x="825" y="350" class="heading" text-anchor="start">THE FEEL</text>
<text x="825" y="388" class="small" text-anchor="start">An ordinary small house in a clearing.</text>
<text x="825" y="418" class="small" text-anchor="start">Dense woods at the back and sides.</text>
<text x="825" y="448" class="small" text-anchor="start">A visible road, mailbox and driveway.</text>
<text x="825" y="478" class="small" text-anchor="start">Space to turn before driving onto the road.</text>
<text x="825" y="536" class="heading" text-anchor="start">WINDOW VIEWS</text>
<text x="825" y="574" class="small" text-anchor="start">Bedrooms + rear hall → trees / back yard.</text>
<text x="825" y="604" class="small" text-anchor="start">Den window → side woods, left of TV.</text>
<text x="825" y="634" class="small" text-anchor="start">Right hall → drive, then side woods.</text>
<text x="825" y="664" class="small" text-anchor="start">Workshop → rear and side trees.</text>
<text x="825" y="722" class="heading" text-anchor="start">GROUND + ROOF</text>
<text x="825" y="760" class="small" text-anchor="start">Main floor slightly above the yard.</text>
<text x="825" y="790" class="small" text-anchor="start">Basement windows sit in shallow wells.</text>
<text x="825" y="820" class="small" text-anchor="start">Simple gable over the house.</text>
<text x="825" y="850" class="small" text-anchor="start">Lower gable over the attached garage.</text>
