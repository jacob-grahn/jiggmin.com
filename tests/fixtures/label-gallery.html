<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Title-screen cartridge labels</title>
<style>body{margin:0;padding:30px;background:#122025;color:#f4ecd5;font:16px system-ui}h1{margin:0 0 8px}p{color:#c8cebe}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}figure{margin:0}canvas{display:block;width:100%;aspect-ratio:385/313;background:#071012}figcaption{padding:8px 0}small{display:block;color:#c8cebe}a{color:inherit}@media(max-width:700px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<h1>Title-screen cartridge labels</h1><p>Captured from all 24 games · 21 title screens and 3 opening screens · select a title to play</p><main></main>
<script type="module">
const base=new URLSearchParams(location.search).has('production')?'/dist':'';
const {drawCartridgeLabel}=await import(base+'/web/cartridge-label.js?v=title-zoom-3');
import {agePaper} from '/web/surface-patina.js';
const {games}=await(await fetch(base+'/data/games.json?v=title-screens-2',{cache:'no-store'})).json();
for(const g of games){
 const f=document.createElement('figure'),canvas=document.createElement('canvas'),c=document.createElement('figcaption'),a=document.createElement('a');
 canvas.width=canvas.height=512;canvas.setAttribute('aria-label',g.title+' cartridge label');
 const image=new Image();image.src=base+'/'+g.cartridgeLabel.file;await image.decode();
 const ctx=canvas.getContext('2d');drawCartridgeLabel(ctx,image,g.cartridgeLabel,g.title);
 const seed=[...g.id].reduce((s,c)=>s*31+c.charCodeAt(0),7)>>>0;agePaper(ctx,512,512,seed);
 a.href='/'+g.id;a.textContent=g.title;c.append(a);
 if(g.cartridgeLabel.style==='opening-screen'){const note=document.createElement('small');note.textContent='Opening screen — no standalone title screen';c.append(note);}
 f.append(canvas,c);document.querySelector('main').append(f);
}
</script>
