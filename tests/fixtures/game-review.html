<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive gameplay review</title>
<style>body{margin:0;background:#10171c;color:#eee;font:14px system-ui}header{padding:12px;display:flex;gap:14px;align-items:center}select,button{padding:8px}#stage{width:min(900px,95vw);height:690px;margin:auto}ruffle-player{width:100%;height:100%}#note{padding:10px;margin:0}</style>
<header><button id="prev">Previous</button><select id="games" aria-label="Game"></select><button id="next">Next</button><span id="title"></span></header><p id="note"></p><div id="stage"></div>
<script src="/web/vendor/ruffle/ruffle.js"></script><script type="module">
import {playbackFile} from '/web/interaction.js?v=swf-compat-1';
const games=(await (await fetch('/data/games.json?v=swf-compat-1')).json()).games,select=document.querySelector('select'),stage=document.querySelector('#stage');let player,index=Math.max(0,games.findIndex(g=>g.id===new URLSearchParams(location.search).get('game'))),ticket=0;
for(const g of games)select.add(new Option(g.title,g.id));
async function load(){const id=++ticket;if(player){player.ruffle().suspend();player.remove();}const g=games[index];select.value=g.id;document.querySelector('#title').textContent=`${index+1} / ${games.length}`;document.querySelector('#note').textContent='Loading '+g.title;player=window.RufflePlayer.newest().createPlayer();stage.replaceChildren(player);await player.ruffle().load({url:'/'+(new URLSearchParams(location.search).has('original') ? (g.mainPayload?.file ?? g.file) : playbackFile(g)),autoplay:'on',unmuteOverlay:'hidden',allowScriptAccess:false,logLevel:'error',scale:'showAll'});if(id===ticket)document.querySelector('#note').textContent=g.title+' — '+g.embedWidth+' × '+g.embedHeight;}
select.onchange=()=>{location.search='?game='+select.value;};document.querySelector('#next').onclick=()=>{location.search='?game='+games[(index+1)%games.length].id;};document.querySelector('#prev').onclick=()=>{location.search='?game='+games[(index+games.length-1)%games.length].id;};load();
</script>
