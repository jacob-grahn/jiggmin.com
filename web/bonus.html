<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workshop cartridges</title>
<style>body{margin:0;background:#171b20;color:#e2d8c5;font:16px system-ui}main{max-width:1000px;margin:40px auto;padding:20px}button,a{color:inherit}button{background:#303840;border:1px solid #827967;padding:12px;cursor:pointer;margin:0 12px 12px 0}#stage{width:100%;max-height:75vh}ruffle-player{width:100%;height:100%}#status{min-height:1.5em}</style>
<main><a href="/">Back to the den</a><h1>Workshop cartridges</h1><p>A couple of games Greg and I made while trying to make 30 games in 30 days. I think we wound up with about six.</p><div id="choices"></div><button id="eject" hidden>Eject</button><p id="status" role="status"></p><div id="stage"></div></main>
<script type="module">
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),eject=document.querySelector('#eject');
let player,ticket=0,runtime;
function stop(){ticket++;if(player){player.ruffle().suspend();player.remove();player=null;}eject.hidden=true;status.textContent='';}
function loadRuntime(){return runtime??=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='/web/vendor/ruffle/ruffle.js';script.onload=resolve;script.onerror=()=>{runtime=null;script.remove();reject(new Error('Could not load the player. Please try again.'));};document.head.append(script);});}
async function play(game){stop();const request=ticket;status.textContent='Loading '+game.title+'…';eject.hidden=false;try{const [response]=await Promise.all([fetch('/'+game.file),loadRuntime()]);if(!response.ok)throw new Error('Could not load the cartridge. Please try again.');const data=await response.arrayBuffer();if(request!==ticket)return;stage.style.aspectRatio=`${game.embedWidth}/${game.embedHeight}`;player=window.RufflePlayer.newest().createPlayer();stage.replaceChildren(player);
// Playback copies remove only the legacy site restriction; originals are archived separately.
await player.ruffle().load({data,swfFileName:game.id+'.swf',autoplay:'on',allowScriptAccess:false,allowNetworking:'internal',scale:'showAll',logLevel:'error'});if(request===ticket)status.textContent=game.title+(game.id==='inkclipse'?' — title screen restored; starting a round still needs repair.':'');
}catch(error){if(request===ticket){stop();status.textContent=error.message;}}}
eject.onclick=stop;
try{const response=await fetch('/data/bonus-games.json');if(!response.ok)throw new Error('Could not load the cartridge list.');const {games}=await response.json();for(const game of games){const button=document.createElement('button');button.textContent=game.title;button.onclick=()=>play(game);document.querySelector('#choices').append(button);}}catch(error){status.textContent=error.message;}
</script></html>
